name: Pi latest compatibility
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latest-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - name: Install the latest Pi release
        run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-coding-agent@latest
      - name: Record the version actually tested
        run: node node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js --version
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:features
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pi-compatibility-failure
          path: test-results/
          if-no-files-found: ignore
