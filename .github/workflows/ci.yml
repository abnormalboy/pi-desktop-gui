name: Build, test and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.RELEASE_TAG !== expected) throw new Error('Release tag must match ' + expected)"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:features
      - name: Package Windows and macOS acceptance builds
        if: matrix.os != 'ubuntu-latest'
        run: node scripts/package.mjs --dir
      - name: Measure ten session switches in the packaged app
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:session-ui -- --packaged
      - name: Install Linux desktop test dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install-deps chromium
      - name: Install Chromium for renderer regression tests
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install chromium
      - name: Test themed window controls and Pi settings
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:desktop-chrome
      - name: Test desktop layout and interactions
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:ui
      - name: Test chat workflows
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:chat-ui
      - name: Test feature panels and approvals
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:features-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            test-results/
            output/playwright/
          if-no-files-found: ignore

  update-roundtrip:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Linux desktop test dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install-deps chromium
      - name: Test Windows installer updates
        if: matrix.os == 'windows-latest'
        run: npm run test:update
      - name: Test Linux AppImage updates
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-roundtrip-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  package:
    needs: [build-and-test, update-roundtrip]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          compression-level: 0

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-desktop-*
          merge-multiple: true
          path: release-assets
      - name: Verify updater metadata and download hashes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-update-metadata.mjs release-assets
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "Pi Desktop $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
